<title>FortEvo — iteration-13 showcase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1600px;
    height: 1600px;
  }
  body {
    position: relative;
    background:
      radial-gradient(circle at 50% 34%, #201f18 0%, #0d0c09 55%, #050504 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  /* athletic diamond-mesh texture, subtle, reminiscent of performance fabric */
  .mesh {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(245,243,238,0.05) 0px, rgba(245,243,238,0.05) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(-45deg, rgba(245,243,238,0.05) 0px, rgba(245,243,238,0.05) 1px, transparent 1px, transparent 34px);
    mask-image: radial-gradient(circle at 50% 38%, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0) 78%);
    -webkit-mask-image: radial-gradient(circle at 50% 38%, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0) 78%);
  }
  /* faint top-down studio light sweep for depth */
  .sweep {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 30%);
  }
  .vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 260px 90px rgba(0,0,0,0.65);
  }
  .mark {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3.6rem;
  }
  .icon-wrap {
    width: 320px;
    filter: drop-shadow(0 26px 46px rgba(0,0,0,0.55));
  }
  .icon-wrap svg { width: 100%; display: block; }
  .wordmark {
    font-size: 4.6rem;
    font-weight: 700;
    letter-spacing: -0.04em;
    color: #F5F3EE;
  }
  .tagline {
    font-size: 1.05rem;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #8E8876;
    margin-top: -2.4rem;
  }
</style>
